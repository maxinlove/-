      :root {

      .layer { position: absolute; inset: 0; }
      .spark { position: absolute; left: 0; top: 0; width: 34px; height: 5px; border-radius: 3px; background: var(--practical); opacity: 0; }
      .spark.hot { background: var(--accent); }
      .glint { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; background: var(--moon);

      .rain { position: absolute; left: 0; top: 0; width: 1080px; pointer-events: none; }
      .flat { position: absolute; inset: 0; opacity: 0; }
      #dipInk, #fade { background: var(--ink); }
      #dipAcc { background: var(--accent); }
      #line { position: absolute; left: 80px; right: 80px; top: 1610px; text-align: center; color: var(--line);
        font-family: var(--font-line); font-weight: 800; font-size: 104px; line-height: 1.2; opacity: 0; }

      for (let f = 0; f < 72; f += 2) s1.push([walk[(f / 2) % 4], f, f + 2]);
      cels(s1);
      for (let f = 0; f < 72; f += 2) tl.set("#walker", { x: (f / 2) * 3 }, T(f));
      cels([["s1eye", 48, 54], ["s1eye", 60, 62]]);

      // ---- 2 · Approach 72–144f · locked; the last drawing holds 30f
      cels([["s2a", 72, 96], ["s2b", 96, 114], ["s2c", 114, 144]]);
      cels([["s2flare", 114, 144]]);

      // ---- 3 · Turn 144–216f · locked; 4f anticipation, then a 40f hold
      cels([["s3a", 144, 172], ["s3b", 172, 176], ["s3c", 176, 216]]);

      // ---- 4 · Sakuga 216–336f · locked, 8 drawings
      cels([
        ["s4d1", 216, 230], // stance
        ["s4d2", 230, 252], // anticipation, coiled
        ["s4d3", 252, 256], // launch
        ["s4d4", 256, 258], // smear 1
        ["s4d5", 258, 260], // smear 2
        ["s4d6", 260, 264], // impact frame, palette inverted
        ["s4d7", 264, 276], // follow-through landing
        ["s4d8", 276, 336], // settled — 60f hold
      ]);
      const h = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
      for (let i = 0; i < 22; i++) {
        const el = document.getElementById("sp" + i);
        if (i % 3 === 0) el.classList.add("hot");
        const f0 = 260 + (i % 4);
        const life = 8 + Math.floor(h(i + 3) * 10);
        const ang = (-60 + h(i) * 150) * Math.PI / 180;
        const sp = 22 + h(i + 7) * 30;
        let x = 700 + h(i + 11) * 60, y = 860 - h(i + 13) * 50, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp;
        for (let k = 0; k < life; k++) {
          tl.set(el, { x: x, y: y, rotation: Math.atan2(vy, vx) * 180 / Math.PI, opacity: 1 - k / life * 0.6 }, T(f0 + k));
          x += vx; y += vy; vy += 3.2; vx *= 0.94;
        }
        tl.set(el, { opacity: 0 }, T(f0 + life));
      }
      for (let k = 0; k <= 12; k++) {
        const t = k / 12;
        tl.set("#glint4", { x: 962 + 100 * t, y: 1584 + 80 * t, scale: 0.4 + Math.sin(Math.PI * t), opacity: 1 }, T(284 + k));
      }
      tl.set("#glint4", { opacity: 0 }, T(297));

      // ---- 5 · Aftermath 336–420f · locked; settled, the scarf follows through inside the hold
      cels([["s5a", 336, 350], ["s5b", 350, 354], ["s5c", 354, 420]]);

      // ---- 6 · Button 420–480f · the line, a hold, 8f fade to ink
      cels([["s6a", 420, 434], ["s6b", 434, 438], ["s6c", 438, 480]]);
      for (let k = 0; k <= 14; k++) {
        const t = k / 14;
        tl.set("#glint6", { x: 842 + 56 * t, y: 1320 - 1010 * t, scale: 0.5 + 0.9 * Math.sin(Math.PI * t), opacity: 1 }, T(440 + k));
      }
      tl.set("#glint6", { opacity: 0 }, T(455));
      cels([["s6sign", 420, 428], ["s6sign", 430, 432], ["s6sign", 434, 480]]);
      tl.fromTo("#line", { opacity: 0 }, { opacity: 1, duration: T(8), ease: "none" }, T(426));
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: T(8), ease: "none" }, T(472));

      // ---- rain on ones
      for (let f = 0; f < 480; f++) {
        tl.set("#rainFar", { y: -480 + (f % 8) * 60 }, T(f));
        tl.set("#rainNear", { y: -640 + (f % 5) * 128 }, T(f));
      }

      // ---- color-dip cuts
      cels([["dipInk", 71, 73], ["dipInk", 143, 145], ["dipAcc", 216, 218], ["dipInk", 335, 337], ["dipInk", 419, 421]]);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
