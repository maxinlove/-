<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efd489">
<title>داعس الفلول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2418; --ink-soft:rgba(58,36,24,.22);
  --paper:#fff7e6; --paper-2:#ffe9b8;
  --red:#e2482f; --red-dark:#a72c1f;
  --teal:#159a8c; --yellow:#ffc233;
  --ground:#efd489;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Baloo Bhaijaan 2','Segoe UI',sans-serif;
  background:var(--ground); color:var(--ink);
  touch-action:none; user-select:none;-webkit-user-select:none;
}
#game{position:fixed;inset:0;display:block}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;z-index:20;pointer-events:none}
.hud-group{display:flex;gap:10px;align-items:flex-start}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 6px 0 var(--ink-soft)}
.hud-label{font-size:.72rem;font-weight:700;opacity:.6;display:block;line-height:1.1}
.hud-value{font-size:1.5rem;font-weight:800;line-height:1.1;display:block;min-width:60px;text-align:center}
.hud-score,.hud-wave{padding:6px 14px;text-align:center}
.hud-nerves{display:flex;align-items:center;gap:8px;padding:7px 12px}
.cups{display:flex;gap:3px}
.cups svg{width:23px;height:23px;display:block}
.icon-btn{pointer-events:auto;width:46px;height:46px;display:grid;place-items:center;cursor:pointer;border-radius:14px;grid-auto-flow:column;gap:4px}
.icon-btn i{width:5px;height:18px;background:var(--ink);border-radius:2px;display:inline-block}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 2px 0 var(--ink-soft)}
.pop{animation:vpop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes vpop{50%{transform:scale(1.3)}}

/* ---------- الشاشات ---------- */
#layer{position:fixed;inset:0;z-index:30;pointer-events:none}
.screen{position:absolute;inset:0;display:grid;place-items:center;padding:20px;pointer-events:auto}
#settings,#pause,#over{background:rgba(58,36,24,.4)}
#layer > .panel, .screen .panel{padding:28px 32px;text-align:center;max-width:min(92vw,440px)}
.panel-title{font-size:2.1rem;font-weight:800;line-height:1.2}
.btn{font-family:inherit;font-size:1.25rem;font-weight:800;color:var(--ink);background:var(--yellow);
  border:3.5px solid var(--ink);border-radius:999px;padding:9px 36px;cursor:pointer;
  box-shadow:0 6px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn-primary{background:var(--red);color:#fff8ec;box-shadow:0 6px 0 var(--red-dark)}
.btn-primary:active{box-shadow:0 1px 0 var(--red-dark)}
.btn-col{display:flex;flex-direction:column;gap:14px;margin-top:20px}

/* ---------- القائمة ---------- */
.menu-panel{padding:34px 38px}
.title{display:flex;gap:14px;justify-content:center;align-items:baseline;font-weight:800;line-height:1}
.t1,.t2{--r:0deg;display:inline-block;font-size:clamp(2.8rem,11vw,4.4rem);
  text-shadow:4px 4px 0 var(--ink);animation:bob 2.4s ease-in-out infinite}
.t1{--r:-4deg;color:var(--red)}
.t2{--r:3deg;color:var(--teal);animation-delay:.3s}
@keyframes bob{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(var(--r)) translateY(-7px)}}
.tagline{margin-top:12px;font-weight:700;font-size:1.05rem}
.hint{margin-top:16px;font-size:.9rem;opacity:.7;font-weight:600}
.credit{margin-top:6px;font-size:.78rem;opacity:.45;font-weight:600}

/* ---------- الإعدادات ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:34px;padding:11px 4px;
  font-weight:700;font-size:1.08rem;border-bottom:2px dashed rgba(58,36,24,.15)}
.toggle{width:64px;height:34px;border-radius:999px;border:3px solid var(--ink);background:#d8c9a8;
  position:relative;cursor:pointer;transition:background .15s;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:4px;width:24px;height:24px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--ink);transition:left .18s cubic-bezier(.2,1.5,.4,1)}
.toggle.on{background:var(--teal)}
.toggle.on::after{left:31px}

/* ---------- نهاية اللعبة ---------- */
.over-title{color:var(--red);text-shadow:3px 3px 0 var(--ink);font-size:2.7rem}
.over-sub{font-weight:600;opacity:.8;margin-top:4px}
.over-stats{display:flex;gap:16px;justify-content:center;margin:16px 0 4px}
.over-stats>div{background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;padding:8px 24px;box-shadow:3px 4px 0 var(--ink-soft)}
.hud-value.big{font-size:2rem;min-width:84px}
.new-best{color:var(--red);font-weight:800;margin-top:8px;animation:vpop .5s cubic-bezier(.2,1.6,.4,1)}

/* ---------- اللافتات ---------- */
#banner{position:fixed;top:33%;left:0;right:0;text-align:center;z-index:25;pointer-events:none;
  font-weight:800;font-size:clamp(2.6rem,9vw,4.4rem);color:var(--yellow);opacity:0;line-height:1.1;
  text-shadow:3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 7px 0 var(--ink)}
#banner.show{animation:stamp 1.4s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes stamp{
  0%{opacity:0;transform:scale(3) rotate(-10deg)}
  18%{opacity:1;transform:scale(1) rotate(-3deg)}
  72%{opacity:1;transform:scale(1) rotate(-3deg)}
  100%{opacity:0;transform:scale(.92) rotate(-3deg) translateY(-16px)}
}
#combo{position:fixed;top:calc(78px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:22;background:var(--teal);color:#fff8ec;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
  border-radius:999px;padding:4px 24px;font-weight:800;font-size:1.3rem;pointer-events:none;white-space:nowrap}
#combo.p{animation:cpop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes cpop{0%{transform:translateX(-50%) scale(1.55)}100%{transform:translateX(-50%) scale(1)}}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(18px);background:var(--ink);color:var(--paper);
  padding:8px 24px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:18}
#flash.go{animation:fl .3s}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}

/* ---------- تحكم اللمس ---------- */
#touch{position:fixed;inset:0;z-index:15}
#stickZone{position:absolute;left:0;top:18%;bottom:0;width:52%}
#tapZone{position:absolute;right:0;top:18%;bottom:0;width:48%}
#stick{position:absolute;width:112px;height:112px;border:3px solid rgba(58,36,24,.5);
  background:rgba(255,247,230,.22);border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;background:var(--paper);
  border:3px solid var(--ink);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 3px 0 var(--ink-soft)}
#btnStomp{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));right:22px;width:98px;height:98px;
  border-radius:50%;background:var(--red);color:#fff8ec;font-family:inherit;font-weight:800;font-size:1.35rem;
  border:4px solid var(--ink);box-shadow:0 6px 0 var(--red-dark);z-index:16;cursor:pointer}
#btnStomp:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dark)}
</style>
</head>
<body>

<canvas id="game" aria-label="لعبة داعس الفلول"></canvas>

<!-- عناصر الواجهة أثناء اللعب -->
<div id="hud" class="hidden">
  <div class="hud-group">
    <div class="panel hud-score"><span class="hud-label">النقاط</span><span id="score" class="hud-value">0</span></div>
    <div class="panel hud-wave"><span class="hud-label">الموجة</span><span id="wave" class="hud-value">1</span></div>
  </div>
  <div class="hud-group">
    <div class="panel hud-nerves"><span class="hud-label">أعصابك</span><span id="nerves" class="cups"></span></div>
    <button id="btnPause" class="panel icon-btn" aria-label="إيقاف مؤقت"><i></i><i></i></button>
  </div>
</div>

<!-- تحكم اللمس -->
<div id="touch" class="hidden">
  <div id="stickZone"></div>
  <div id="tapZone"></div>
  <div id="stick"><div id="stickKnob"></div></div>
  <button id="btnStomp">داعس!</button>
</div>

<!-- الطبقات: قائمة / إعدادات / إيقاف / نهاية -->
<div id="layer">
  <section id="menu" class="screen">
    <div class="panel menu-panel">
      <div class="title"><span class="t1">داعس</span><span class="t2">الفلول</span></div>
      <p class="tagline">دوس الفلّول قبل ما يخلّصولك أعصابك!</p>
      <div class="btn-col">
        <button class="btn btn-primary" id="btnStart">ابدأ اللعب</button>
        <button class="btn" id="btnSettings">الإعدادات</button>
      </div>
      <p class="hint" id="hintText"></p>
      <p class="credit">مصنوع بحب وقهوة مرّة</p>
    </div>
  </section>

  <section id="settings" class="screen hidden">
    <div class="panel">
      <h2 class="panel-title">الإعدادات</h2>
      <div class="set-row"><span>الموسيقى</span><button class="toggle" data-key="music" aria-label="الموسيقى"></button></div>
      <div class="set-row"><span>المؤثرات الصوتية</span><button class="toggle" data-key="sfx" aria-label="المؤثرات الصوتية"></button></div>
      <div class="set-row"><span>اهتزاز الشاشة</span><button class="toggle" data-key="shake" aria-label="اهتزاز الشاشة"></button></div>
      <div class="btn-col"><button class="btn" id="btnBack">رجوع</button></div>
    </div>
  </section>

  <section id="pause" class="screen hidden">
    <div class="panel">
      <h2 class="panel-title">استراحة قهوة</h2>
      <div class="btn-col">
        <button class="btn btn-primary" id="btnResume">متابعة</button>
        <button class="btn" id="btnSettings2">الإعدادات</button>
        <button class="btn" id="btnExit1">الخروج</button>
      </div>
    </div>
  </section>

  <section id="over" class="screen hidden">
    <div class="panel">
      <h2 class="panel-title over-title">انعصبت!</h2>
      <p class="over-sub" id="overSub"></p>
      <div class="over-stats">
        <div><span class="hud-label">النتيجة</span><span class="hud-value big" id="overScore">0</span></div>
        <div><span class="hud-label">أحسن نتيجة</span><span class="hud-value big" id="overBest">0</span></div>
      </div>
      <p id="newBest" class="new-best hidden">رقم قياسي جديد!</p>
      <div class="btn-col">
        <button class="btn btn-primary" id="btnRetry">إعادة المحاولة</button>
        <button class="btn" id="btnExit2">الخروج</button>
      </div>
    </div>
  </section>
</div>

<div id="banner"></div>
<div id="combo" class="hidden">كومبو ×2</div>
<div id="toast"></div>
<div id="flash"></div>

<script>
"use strict";
/* =========================================================
   داعس الفلول — نسخة المتصفح
   البنية تعادل مشروع غودو: MainMenu / Game / Player / FloolEnemy / UI
   ========================================================= */

// ---------- أدوات عامة ----------
const TAU = Math.PI * 2;
const INK = '#3a2418';
const FONT = '"Baloo Bhaijaan 2","Segoe UI",sans-serif';
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a=>a[(Math.random()*a.length)|0];
const eob = t=>1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2);      // easeOutBack
const eoc = t=>1-Math.pow(1-t,3);                              // easeOutCubic
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function starPath(c,x,y,r,rot){rot=rot||0;c.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5;const rr2=i%2?r*0.45:r;const px=x+Math.cos(a)*rr2,py=y+Math.sin(a)*rr2;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();}
const store={
  get(k,d){try{const v=localStorage.getItem('daes_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('daes_'+k,JSON.stringify(v));}catch(e){}}
};

// ---------- نصوص اللعبة (عربي فقط) ----------
const PLAYER_LINES=[
  'هاد كلسون معلمك بشار الجحش!',
  'الإشاعة ما بتمشي هون!',
  'ارجع نام!'
];
const FOOL_LINES=[
  'ماهر جاي يعمل إنزال مظلي!',
  'راجع ماهر بالبيجاما!',
  'النمر الوردي جاييكن!',
  'الوضع خطير كتير!'
];
const OVER_LINES=[
  'الفلّول غلبوك… ارتشف قهوتك ورجع جرّب!',
  'حتى بشار الجحش عتب عليك اليوم!',
  'ولا يهمك، الفلّول فاكرة إنك كسبت!'
];

// ---------- فناجين الأعصاب ----------
const CUP = on => on
? '<svg viewBox="0 0 44 44"><path d="M10 16h22l-2.6 15a4 4 0 0 1-4 3.4h-8.8a4 4 0 0 1-4-3.4Z" fill="#fff6e3" stroke="#3a2418" stroke-width="3"/><path d="M11.5 21h19" stroke="#8a5a34" stroke-width="4"/><path d="M32 20c3-1.5 3 4 6 2" fill="none" stroke="#3a2418" stroke-width="3" stroke-linecap="round"/><path d="M16 12c0-3 3-3 3-6M24 12c0-3 3-3 3-6" fill="none" stroke="#9fb2ac" stroke-width="3" stroke-linecap="round"/></svg>'
: '<svg viewBox="0 0 44 44"><ellipse cx="20" cy="35" rx="15" ry="4.5" fill="#9ad0c8" stroke="#3a2418" stroke-width="2.5"/><g transform="rotate(118 22 20)"><path d="M10 14h22l-2.6 15a4 4 0 0 1-4 3.4h-8.8a4 4 0 0 1-4-3.4Z" fill="#e9ddc6" stroke="#3a2418" stroke-width="3"/><path d="M11.5 19h19" stroke="#c9b892" stroke-width="4"/></g></svg>';

/* =========================================================
   الصوت: موسيقى خفيفة + مؤثرات (مولّدة عبر Web Audio)
   ========================================================= */
class SoundKit{
  constructor(){
    this.ctx=null;
    this.musicOn=store.get('music',true);
    this.sfxOn=store.get('sfx',true);
    this.shakeOn=store.get('shake',true);
    this._m={on:false,timer:null,step:0,next:0};
  }
  ensure(){
    if(this.ctx){ if(this.ctx.state==='suspended')this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    this.ctx=new AC();
    this.master=this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(this.ctx.destination);
    this.sfxBus=this.ctx.createGain(); this.sfxBus.gain.value=this.sfxOn?1:0; this.sfxBus.connect(this.master);
    this.musBus=this.ctx.createGain(); this.musBus.gain.value=.5; this.musBus.connect(this.master);
  }
  get t(){return this.ctx?this.ctx.currentTime:0}
  tone(o){
    if(!this.ctx)return;
    const c=this.ctx,t0=o.at||this.t;
    const osc=c.createOscillator();osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f0,t0);
    if(o.f1)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1),t0+o.dur);
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(o.vol||.2,t0+(o.atk||.008));
    g.gain.exponentialRampToValueAtTime(.0001,t0+o.dur);
    osc.connect(g);g.connect(o.bus||this.sfxBus);
    osc.start(t0);osc.stop(t0+o.dur+.05);
  }
  noise(o){
    if(!this.ctx)return;
    const c=this.ctx,t0=o.at||this.t;
    const len=Math.max(1,Math.ceil(c.sampleRate*o.dur));
    const buf=c.createBuffer(1,len,c.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;
    const fl=c.createBiquadFilter();fl.type=o.type||'lowpass';fl.frequency.value=o.f||1000;fl.Q.value=o.q||.8;
    const g=c.createGain();
    g.gain.setValueAtTime(o.vol||.3,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+o.dur);
    src.connect(fl);fl.connect(g);g.connect(o.bus||this.sfxBus);
    src.start(t0);src.stop(t0+o.dur+.05);
  }
  ok(){return this.ctx&&this.sfxOn}
  click(){if(this.ok())this.tone({f0:660,f1:880,dur:.07,type:'square',vol:.07});}
  jump(){if(this.ok())this.tone({f0:260,f1:540,dur:.09,type:'triangle',vol:.1});}
  stomp(){if(this.ok()){this.tone({f0:150,f1:42,dur:.22,type:'sine',vol:.65});this.noise({dur:.14,f:500,vol:.32});}}
  horn(){ // البوق الكوميدي
    if(!this.ok())return;const t=this.t;
    this.tone({f0:340,f1:620,dur:.16,type:'sawtooth',vol:.14,at:t});
    this.tone({f0:620,f1:230,dur:.3,type:'sawtooth',vol:.14,at:t+.15});
    this.tone({f0:340,f1:620,dur:.16,type:'square',vol:.05,at:t});
    this.tone({f0:620,f1:230,dur:.3,type:'square',vol:.05,at:t+.15});
  }
  poof(){if(this.ok()){this.noise({dur:.3,f:900,type:'bandpass',q:.6,vol:.4});this.tone({f0:520,f1:140,dur:.22,type:'triangle',vol:.1});}}
  squeal(){if(this.ok()){const f=rand(500,900);this.tone({f0:f,f1:f*2.1,dur:.16,type:'square',vol:.06});}}
  giggle(){if(this.ok()){const t=this.t;this.tone({f0:500,f1:760,dur:.08,type:'square',vol:.07,at:t});this.tone({f0:640,f1:920,dur:.08,type:'square',vol:.07,at:t+.09});}}
  starsSfx(){if(this.ok()){const t=this.t;[880,1174,1568].forEach((f,i)=>this.tone({f0:f,dur:.1,type:'triangle',vol:.09,at:t+i*.07}));}}
  hurt(){if(this.ok()){this.tone({f0:320,f1:110,dur:.3,type:'sawtooth',vol:.16});this.noise({dur:.2,f:300,vol:.18});}}
  whiff(){if(this.ok()){this.noise({dur:.12,f:1800,type:'highpass',vol:.1});this.tone({f0:220,f1:120,dur:.12,type:'triangle',vol:.07});}}
  waveSfx(){if(this.ok()){const t=this.t;[293.66,369.99,440,587.33].forEach((f,i)=>this.tone({f0:f,dur:.16,type:'square',vol:.06,at:t+i*.09}));}}
  moan(){if(this.ok())this.tone({f0:rand(140,190),f1:rand(90,120),dur:.35,type:'sawtooth',vol:.04});}
  // موسيقى: مقام حجاز مرح — إيقاع متكرر خفيف
  startMusic(){
    if(!this.ctx||!this.musicOn||this._m.on)return;
    const m=this._m;m.on=true;m.step=0;m.next=this.t+.1;
    const SD=60/116/2;
    m.timer=setInterval(()=>{
      if(!m.on)return;
      while(m.next<this.t+.16){this._step(m.step%32,m.next);m.step++;m.next+=SD;}
    },70);
  }
  stopMusic(){const m=this._m;m.on=false;if(m.timer){clearInterval(m.timer);m.timer=null;}}
  _step(s,t){
    const SC=[293.66,311.13,369.99,392,440,466.16,523.25,587.33];
    const MEL=[0,2,4,5,4,2,0,null, 1,2,3,4,3,2,1,null, 0,2,4,7,6,5,4,3, 4,5,4,3,2,1,0,null];
    const BASS=[[73.42,110,73.42,110],[116.54,110,116.54,110],[73.42,110,98,110],[116.54,110,73.42,73.42]];
    const bar=(s>>3)&3, st=s&7;
    const n=MEL[s];if(n!=null)this.tone({f0:SC[n],dur:.16,type:'triangle',vol:.1,at:t,bus:this.musBus});
    if(st%2===0){const b=BASS[bar][(st>>1)&3];this.tone({f0:b,dur:.2,type:'triangle',vol:.14,at:t,bus:this.musBus});}
    if(st===0||st===4)this.tone({f0:130,f1:45,dur:.1,type:'sine',vol:.26,at:t,bus:this.musBus});
    this.noise({dur:.03,f:7000,type:'highpass',vol:st%2?.026:.05,at:t,bus:this.musBus});
    if(st===2||st===6)this.noise({dur:.05,f:420,type:'bandpass',q:1.5,vol:.05,at:t,bus:this.musBus});
  }
  setMusic(on){this.musicOn=on;store.set('music',on);if(on)this.startMusic();else this.stopMusic();}
  setSfx(on){this.sfxOn=on;store.set('sfx',on);if(this.sfxBus)this.sfxBus.gain.value=on?1:0;}
}

/* =========================================================
   اللاعب — يعادل scripts/Player.gd
   ========================================================= */
class Player{
  constructor(){this.r=22;this.stompR=128;this.reset(0,0);}
  reset(x,y){
    this.x=x;this.y=y;this.vx=0;this.vy=0;this.facing=1;
    this.state='idle';this.animT=0;this.cool=0;this.jumpT=0;this.jumpY=0;this.landT=0;
    this.invuln=0;this.sx=1;this.sy=1;this.bubble=null;
  }
  say(text,life){this.bubble={text,t:0,life:life||1.8};}
  update(dt,inp,game){
    if(this.invuln>0)this.invuln-=dt;
    if(this.cool>0)this.cool-=dt;
    if(this.bubble){this.bubble.t+=dt;if(this.bubble.t>this.bubble.life)this.bubble=null;}
    this.sx+=(1-this.sx)*Math.min(1,dt*10);
    this.sy+=(1-this.sy)*Math.min(1,dt*10);
    const busy=this.state==='jump'||this.state==='land';
    if(!busy){
      const sp=280;
      const k=Math.min(1,dt*12);
      this.vx+=(inp.mx*sp-this.vx)*k;
      this.vy+=(inp.my*sp-this.vy)*k;
      this.x=clamp(this.x+this.vx*dt,40,game.W-40);
      this.y=clamp(this.y+this.vy*dt,120,game.H-46);
      const mv=Math.hypot(inp.mx,inp.my);
      if(mv>.15){
        this.state='run';
        if(Math.abs(inp.mx)>.1)this.facing=inp.mx>0?1:-1;
        this.animT+=dt*(7+mv*8);
        if(Math.random()<dt*6)game.dust(this.x-this.facing*10,this.y,.7);
      }else this.state='idle';
      if(inp.action&&this.cool<=0){
        this.state='jump';this.jumpT=0;this.cool=.62;
        this.vx*=.4;this.vy*=.4;this.sy=1.15;this.sx=.9;
        game.sound.jump();
      }
    }else if(this.state==='jump'){
      this.jumpT+=dt;const T=.3,q=Math.min(1,this.jumpT/T);
      this.jumpY=Math.sin(q*Math.PI);
      this.sx=1-.08*this.jumpY;this.sy=1+.12*this.jumpY;
      this.x=clamp(this.x+this.vx*dt*.35,40,game.W-40);
      this.y=clamp(this.y+this.vy*dt*.35,120,game.H-46);
      if(q>=1){
        this.state='land';this.landT=0;this.jumpY=0;this.sx=1.35;this.sy=.62;
        game.onStompImpact(this);
      }
    }else{ // land
      this.landT+=dt;
      if(this.landT>.16)this.state='idle';
    }
  }
  drawShadow(c){
    c.fillStyle='rgba(58,36,24,.18)';
    const k=1-this.jumpY*.45;
    c.beginPath();c.ellipse(this.x,this.y+3,24*k,8.5*k,0,0,TAU);c.fill();
  }
  draw(c,gt){
    if(this.invuln>0&&Math.floor(gt*16)%2===0)return; // وميض بعد الزعزة
    const air=this.jumpY,run=this.state==='run',jump=this.state==='jump',land=this.state==='land';
    c.save();
    c.translate(this.x,this.y);
    c.scale(this.facing,1);
    c.rotate(run?.08:(air>0?.1:0));
    c.scale(this.sx,this.sy);
    c.translate(0,-air*56);
    const ph=this.animT;
    const bob=run?Math.sin(ph*2)*1.6:Math.sin(gt*2.2)*1.2;
    // ----- الرجلان -----
    for(let i=0;i<2;i++){
      const sd=i?1:-1;let fx=sd*7,fy=0;
      if(jump){fx=sd*9;fy=-16-air*8;}
      else if(run){const s=Math.sin(ph+(i?0:Math.PI));fx=sd*6+s*9;fy=-Math.max(0,s)*7;}
      else fx=sd*7+Math.sin(gt*2+sd)*1.2;
      c.strokeStyle='#4b5b6e';c.lineWidth=10;c.lineCap='round';
      c.beginPath();c.moveTo(sd*7,-30+bob*.3);c.lineTo(fx,fy-8);c.stroke();
      c.fillStyle='#7c4a2d';c.strokeStyle=INK;c.lineWidth=2.5;
      rr(c,fx-7,fy-11,18,11,4);c.fill();c.stroke();
      c.fillStyle='#55321d';rr(c,fx-8,fy-3,20,4,2);c.fill();
    }
    // ----- الجذع -----
    c.save();c.translate(0,bob);
    c.fillStyle='#f8f1df';c.strokeStyle=INK;c.lineWidth=3;
    rr(c,-15,-62,30,36,10);c.fill();c.stroke();
    c.strokeStyle='#d9402f';c.lineWidth=4.5;c.lineCap='butt';
    c.beginPath();c.moveTo(-7,-60);c.lineTo(-7,-32);c.moveTo(7,-60);c.lineTo(7,-32);c.stroke();
    c.fillStyle='#55321d';rr(c,-15,-34,30,8,3);c.fill();
    c.strokeStyle=INK;c.lineWidth=2.5;rr(c,-15,-34,30,8,3);c.stroke();
    c.fillStyle='#ffc233';rr(c,-3.5,-33,7,6,2);c.fill();
    // ----- الذراعان -----
    const arm=(shx,shy,hx,hy2)=>{
      c.lineCap='round';
      c.strokeStyle=INK;c.lineWidth=11.5;c.beginPath();c.moveTo(shx,shy);c.lineTo(hx,hy2);c.stroke();
      c.strokeStyle='#f8f1df';c.lineWidth=8;c.beginPath();c.moveTo(shx,shy);c.lineTo(hx,hy2);c.stroke();
      c.fillStyle='#f2b279';c.beginPath();c.arc(hx,hy2,5.5,0,TAU);c.fill();
      c.strokeStyle=INK;c.lineWidth=2.5;c.beginPath();c.arc(hx,hy2,5.5,0,TAU);c.stroke();
    };
    if(jump){arm(-12,-56,-22,-88-Math.sin(gt*20)*3);arm(12,-56,24,-92+Math.sin(gt*20)*3);}
    else if(land){arm(-12,-56,-26,-46);arm(12,-56,26,-46);}
    else if(run){const s=Math.sin(ph);
      arm(-12,-56,-16-s*5,-42+s*5);arm(12,-56,18+s*5,-42-s*5);}
    else{arm(-12,-56,-17,-38+Math.sin(gt*2)*1.5);arm(12,-56,17,-38-Math.sin(gt*2)*1.5);}
    // ----- الرأس -----
    c.fillStyle='#f2b279';c.strokeStyle=INK;c.lineWidth=3;
    c.beginPath();c.arc(1,-79,16,0,TAU);c.fill();c.stroke();
    c.beginPath();c.arc(-14,-79,3.6,0,TAU);c.fill();c.stroke();
    c.beginPath();c.arc(16,-79,3.6,0,TAU);c.fill();c.stroke();
    c.fillStyle='#2c1c12';
    c.beginPath();c.ellipse(-12,-86,5,7,.5,0,TAU);c.fill();
    c.beginPath();c.ellipse(13,-86,5,7,-.5,0,TAU);c.fill();
    c.fillStyle=INK;
    c.beginPath();c.arc(6,-82,2.3,0,TAU);c.fill();
    c.beginPath();c.arc(13,-82,2.3,0,TAU);c.fill();
    c.strokeStyle=INK;c.lineWidth=3;c.lineCap='round';
    c.beginPath();c.moveTo(3,-88);c.lineTo(8,-86.4);c.moveTo(11,-86.4);c.lineTo(16,-88);c.stroke();
    c.beginPath();c.arc(10,-79,3,.3,2.2);c.stroke();
    // الشارب الكبير
    c.fillStyle='#2c1c12';
    c.beginPath();c.ellipse(5,-73,6,3.2,.35,0,TAU);c.fill();
    c.beginPath();c.ellipse(13,-73,6,3.2,-.35,0,TAU);c.fill();
    c.strokeStyle=INK;c.lineWidth=2.5;
    c.beginPath();c.arc(9,-70.5,3,.4,2.5);c.stroke();
    // الطربوش
    c.save();c.translate(0,-94);c.rotate(-.14);
    c.fillStyle='#d9402f';c.strokeStyle=INK;c.lineWidth=3;
    rr(c,-11,-9,22,13,3);c.fill();c.stroke();
    c.fillStyle='#a72c1f';rr(c,-11,-9,22,4,2);c.fill();
    c.strokeStyle=INK;c.lineWidth=2.5;
    c.beginPath();c.moveTo(-9,-6);c.lineTo(-16,3);c.stroke();
    c.fillStyle=INK;c.beginPath();c.arc(-16.5,4,3,0,TAU);c.fill();
    c.restore();
    c.restore();
    c.restore();
  }
}

/* =========================================================
   الفلّول — يعادل scripts/FloolEnemy.gd
   ========================================================= */
class Flool{
  constructor(x,y,variant,game){
    this.x=x;this.y=y;this.variant=variant;
    const cfg={
      normal:{r:19,scale:1,points:10,speed:[46,62]},
      speedy:{r:16,scale:.82,points:15,speed:[95,115]},
      chunky:{r:27,scale:1.3,points:25,speed:[30,40]}
    }[variant];
    this.r=cfg.r;this.scale=cfg.scale;this.points=cfg.points;
    this.speed=rand(cfg.speed[0],cfg.speed[1])*(1+(game.wave||0)*.03);
    this.pajama=variant==='speedy'?{a:'#f6b9c9',b:'#ee8fa9'}
             :variant==='chunky'?{a:'#bcb6e8',b:'#938bd0'}
             :{a:'#9fd6c8',b:'#77bfae'};
    this.skin=variant==='chunky'?'#b6dba6':'#a9d69d';
    this.state='walk';this.wob=rand(0,10);this.face=1;
    this.thinkT=rand(1.5,5);this.t=0;this.bubble=null;this.cheerT=0;
  }
  get gone(){return this.state==='dead'}
  get targetable(){return this.state==='walk'||this.state==='cheer'}
  update(dt,game){
    this.t+=dt;this.wob+=dt;
    if(this.bubble){this.bubble.t+=dt;if(this.bubble.t>this.bubble.life)this.bubble=null;}
    const p=game.player;
    switch(this.state){
      case 'walk':{
        const dx=p.x-this.x,dy=p.y-this.y,d=Math.hypot(dx,dy)||1;
        this.face=dx>0?1:-1;
        const w=Math.sin(this.wob*1.7)*.5;
        const ux=dx/d,uy=dy/d;
        this.x+=(ux-uy*w)*this.speed*dt;
        this.y+=(uy+ux*w)*this.speed*dt*.9;
        if(d<this.r+p.r+4)game.onFloolTouch(this);
        this.thinkT-=dt;
        if(this.thinkT<=0){
          this.thinkT=rand(4,8);
          if(game.bubbleCount<3){this.bubble={text:pick(FOOL_LINES),t:0,life:2};game.sound.moan();}
        }
        break;
      }
      case 'cheer':{
        this.cheerT-=dt;if(this.cheerT<=0)this.state='walk';
        break;
      }
      case 'panic':{
        const dx=this.x-p.x,dy=this.y-p.y,d=Math.hypot(dx,dy)||1;
        const sp=this.speed*3.4;
        this.x+=dx/d*sp*dt;this.y+=dy/d*sp*dt;
        this.face=dx>0?1:-1;
        if(Math.random()<dt*10)game.dust(this.x,this.y,.6);
        if(this.x<-90||this.x>game.W+90||this.y<-90||this.y>game.H+90)this.state='dead';
        break;
      }
      case 'poof':{if(this.t>.24)this.state='dead';break;}
      case 'stars':{if(this.t>.9)this.state='dead';break;}
    }
  }
  defeat(game){
    if(!this.targetable)return false;
    const fate=Math.random();this.t=0;
    if(fate<.38){ // دخان
      this.state='poof';
      game.smokeAt(this.x,this.y-40*this.scale,this.scale);
      game.sound.poof();
      if(Math.random()<.5)game.popup(this.x,this.y-76*this.scale,'بووف!','#8b8378');
    }else if(fate<.72){ // نجوم كرتونية
      this.state='stars';
      game.sound.starsSfx();
      game.burstStars(this.x,this.y-60*this.scale);
    }else{ // هربان
      this.state='panic';
      game.sound.squeal();
      game.popup(this.x,this.y-76*this.scale,'هربان!','#e2482f');
    }
    const gain=Math.round(this.points*game.multNow());
    game.addScore(gain,this.x,this.y-46*this.scale);
    return true;
  }
  drawShadow(c){
    let r=20*this.scale;
    if(this.state==='poof')r*=Math.max(0,1-this.t/.24);
    if(this.state==='stars'&&this.t>.5)r*=Math.max(0,1-(this.t-.5)/.4);
    c.fillStyle='rgba(58,36,24,.16)';
    c.beginPath();c.ellipse(this.x,this.y+2,r,r*.38,0,0,TAU);c.fill();
  }
  draw(c,gt){
    const s=this.scale,panic=this.state==='panic',cheer=this.state==='cheer';
    let sqx=1,sqy=1;
    if(this.state==='poof'){const k=Math.max(.01,1-this.t/.24);sqx=k;sqy=k;}
    if(this.state==='stars'&&this.t>.5){const k=Math.max(.01,1-(this.t-.5)/.4);sqx=k;sqy=k;}
    c.save();
    c.translate(this.x,this.y);
    c.scale(this.face*s*sqx,s*sqy);
    if(this.state==='stars')c.rotate(this.t*10);
    else c.rotate(Math.sin(this.wob*(panic?26:4))*.09);
    if(cheer)c.translate(0,-Math.abs(Math.sin(gt*11+this.wob))*14);
    const run=panic?26:4.5,ph=gt*run+this.wob;
    // ----- الرجلان (شروال + شبشب وحدة) -----
    const lw=this.variant==='chunky'?10:9;
    for(let i=0;i<2;i++){
      const sd=i?1:-1;
      const fx=sd*6+Math.sin(ph+(i?0:Math.PI))*(panic?10:6);
      const fy=-Math.max(0,Math.sin(ph+(i?0:Math.PI)))*(panic?7:4);
      c.strokeStyle=this.pajama.a;c.lineWidth=lw;c.lineCap='round';
      c.beginPath();c.moveTo(sd*7,-30);c.lineTo(fx,fy-8);c.stroke();
      if(i===0){c.fillStyle='#8a5a34';c.beginPath();c.ellipse(fx+4,fy-4,8,4.5,0,0,TAU);c.fill();
        c.strokeStyle=INK;c.lineWidth=2;c.stroke();}
      else{c.fillStyle=this.skin;c.beginPath();c.ellipse(fx+3,fy-4,7,4,0,0,TAU);c.fill();
        c.strokeStyle=INK;c.lineWidth=2;c.stroke();}
    }
    // ----- البيجاما المقلّمة -----
    const tw=this.variant==='chunky'?20:14;
    rr(c,-tw,-60,tw*2,36,10);
    c.save();c.clip();
    c.fillStyle=this.pajama.a;c.fillRect(-tw,-60,tw*2,36);
    c.fillStyle=this.pajama.b;
    for(let sx=-tw+2;sx<tw;sx+=7)c.fillRect(sx,-60,3.4,36);
    c.restore();
    rr(c,-tw,-60,tw*2,36,10);
    c.strokeStyle=INK;c.lineWidth=3;c.stroke();
    c.fillStyle=INK;
    c.beginPath();c.arc(0,-50,1.8,0,TAU);c.fill();
    c.beginPath();c.arc(0,-43,1.8,0,TAU);c.fill();
    // ----- الذراعان -----
    const armLw=this.variant==='chunky'?11:8;
    const arm2=(shx,shy,hx,hy2)=>{
      c.lineCap='round';
      c.strokeStyle=INK;c.lineWidth=armLw+4;c.beginPath();c.moveTo(shx,shy);c.lineTo(hx,hy2);c.stroke();
      c.strokeStyle=this.pajama.a;c.lineWidth=armLw;c.beginPath();c.moveTo(shx,shy);c.lineTo(hx,hy2);c.stroke();
      c.fillStyle=this.skin;c.beginPath();c.arc(hx,hy2,5,0,TAU);c.fill();
      c.strokeStyle=INK;c.lineWidth=2.2;c.stroke();
    };
    if(panic||cheer){
      arm2(-10,-52,-16,-88+Math.sin(gt*30)*5);
      arm2(10,-52,16,-92-Math.sin(gt*30)*5);
    }else{
      arm2(-10,-52,20+Math.sin(this.wob*3)*2,-46+Math.sin(this.wob*3+2)*4);
      arm2(10,-52,23,-42+Math.sin(this.wob*3+4)*4);
    }
    // ----- الرأس -----
    const hy=-72;
    c.fillStyle=this.skin;c.strokeStyle=INK;c.lineWidth=3;
    c.beginPath();c.arc(2,hy,14,0,TAU);c.fill();c.stroke();
    c.fillStyle='#4c3a29';
    for(let i=0;i<5;i++){
      const a=-2.5+i*.36;
      const bx=2+Math.cos(a)*13,by=hy+Math.sin(a)*13;
      c.beginPath();c.moveTo(bx-3,by+1);c.lineTo(bx+Math.cos(a)*8,by+Math.sin(a)*8-2);c.lineTo(bx+3,by+1);c.closePath();c.fill();
    }
    if(this.state==='stars'){ // عيون دوخة
      c.fillStyle=INK;
      starPath(c,4,hy-3,4.5,gt*3);c.fill();
      starPath(c,12,hy-3,4.5,-gt*3);c.fill();
    }else{
      const pr=panic?6:4.6;
      for(const ex of [4,12]){
        c.fillStyle='#fff';c.beginPath();c.arc(ex,hy-3,pr,0,TAU);c.fill();
        c.strokeStyle=INK;c.lineWidth=2;c.stroke();
        c.fillStyle=INK;
        if(panic){c.beginPath();c.arc(ex,hy-3,1.3,0,TAU);c.fill();}
        else if(ex===4){c.beginPath();c.arc(ex+1.3,hy-2.2,1.9,0,TAU);c.fill();}
        else{c.beginPath();c.arc(ex-1.3,hy-3.8,1.9,0,TAU);c.fill();}
      }
    }
    if(this.state!=='stars'){
      c.strokeStyle=INK;c.lineWidth=2;c.lineCap='round';
      const lift=panic?4:2;
      c.beginPath();c.moveTo(1,hy-9-lift);c.lineTo(7,hy-10-lift);c.moveTo(9,hy-10-lift);c.lineTo(15,hy-9-lift);c.stroke();
    }
    // الفم المفتوح
    c.fillStyle='#5f2f2f';c.strokeStyle=INK;c.lineWidth=2;
    const mrx=panic?5:3.5,mry=panic?6.5:2.5+Math.sin(this.wob*6)*1.5;
    c.beginPath();c.ellipse(8,hy+7,mrx,mry,0,0,TAU);c.fill();c.stroke();
    c.fillStyle='#f2a0a8';
    c.beginPath();c.ellipse(8,hy+8+ (panic?2:1),mrx*.5,mry*.4,0,0,TAU);c.fill();
    // وميض الدخان
    if(this.state==='poof'){
      c.globalAlpha=Math.max(0,1-this.t/.24)*.7;
      c.fillStyle='#fff';
      c.beginPath();c.arc(0,-50,32,0,TAU);c.fill();
      c.globalAlpha=1;
    }
    // نجوم مدارية
    if(this.state==='stars'){
      for(let i=0;i<3;i++){
        const a=gt*7+i*2.09;
        c.fillStyle='#ffc233';c.strokeStyle=INK;c.lineWidth=2;
        starPath(c,2+Math.cos(a)*24,hy-4+Math.sin(a)*10,6,a);
        c.fill();c.stroke();
      }
    }
    c.restore();
  }
}

/* =========================================================
   الواجهة — تعادل scenes/UI.tscn + scripts/UI.gd
   ========================================================= */
class UI{
  constructor(g){
    this.g=g;
    const $=id=>document.getElementById(id);
    this.el={hud:$('hud'),score:$('score'),wave:$('wave'),nerves:$('nerves'),
      menu:$('menu'),settings:$('settings'),pause:$('pause'),over:$('over'),layer:$('layer'),
      banner:$('banner'),combo:$('combo'),toast:$('toast'),flash:$('flash'),
      overScore:$('overScore'),overBest:$('overBest'),overSub:$('overSub'),newBest:$('newBest')};
    this._toastT=null;this._comboT=null;this._from='menu';
    $('btnStart').onclick=()=>{g.sound.ensure();g.sound.click();g.startGame();};
    $('btnSettings').onclick=()=>{g.sound.ensure();g.sound.click();this._from='menu';this.show('settings');};
    $('btnSettings2').onclick=()=>{g.sound.click();this._from='pause';this.show('settings');};
    $('btnBack').onclick=()=>{g.sound.click();this.show(this._from||'menu');};
    $('btnResume').onclick=()=>{g.sound.click();g.resume();};
    $('btnExit1').onclick=()=>{g.sound.click();g.toMenu();};
    $('btnExit2').onclick=()=>{g.sound.click();g.toMenu();};
    $('btnRetry').onclick=()=>{g.sound.click();g.startGame();};
    $('btnPause').onclick=()=>{g.sound.click();g.pause();};
    document.querySelectorAll('.toggle').forEach(t=>{
      const k=t.dataset.key;
      const val=()=>k==='music'?g.sound.musicOn:k==='sfx'?g.sound.sfxOn:g.sound.shakeOn;
      const sync=()=>t.classList.toggle('on',val());
      sync();
      t.onclick=()=>{
        g.sound.ensure();g.sound.click();
        if(k==='music')g.sound.setMusic(!g.sound.musicOn);
        else if(k==='sfx')g.sound.setSfx(!g.sound.sfxOn);
        else{g.sound.shakeOn=!g.sound.shakeOn;store.set('shake',g.sound.shakeOn);}
        sync();
      };
    });
  }
  show(name){
    ['menu','settings','pause','over'].forEach(k=>this.el[k].classList.toggle('hidden',k!==name));
    this.el.layer.classList.toggle('hidden',!name);
  }
  hud(on){this.el.hud.classList.toggle('hidden',!on);}
  setScore(v){const e=this.el.score;e.textContent=v;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');}
  setWave(v){const e=this.el.wave;e.textContent=v;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');}
  renderNerves(cur,max){let h='';for(let i=0;i<max;i++)h+=CUP(i<cur);this.el.nerves.innerHTML=h;}
  banner(text,color){
    const b=this.el.banner;b.textContent=text;
    b.style.color=color||'#ffc233';
    b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
  }
  comboShow(n){
    const c=this.el.combo;c.textContent='كومبو ×'+n;
    c.classList.remove('hidden','p');void c.offsetWidth;c.classList.add('p');
    clearTimeout(this._comboT);
    this._comboT=setTimeout(()=>this.comboHide(),1600);
  }
  comboHide(){this.el.combo.classList.add('hidden');}
  toast(text,dur){
    const t=this.el.toast;t.textContent=text;t.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT=setTimeout(()=>t.classList.remove('show'),(dur||1.8)*1000);
  }
  flash(){const f=this.el.flash;f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}
  showOver(score,best,isNew){
    this.el.overScore.textContent=score;
    this.el.overBest.textContent=best;
    this.el.overSub.textContent=pick(OVER_LINES);
    this.el.newBest.classList.toggle('hidden',!isNew);
    this.show('over');
  }
}

/* =========================================================
   اللعبة — تعادل scenes/Game.tscn + scripts/Game.gd
   ========================================================= */
class Game{
  constructor(cv){
    this.cv=cv;this.ctx=cv.getContext('2d');
    this.sound=new SoundKit();
    this.ui=new UI(this);
    this.player=new Player();
    this.fools=[];this.parts=[];
    this.keys=new Set();
    this.joy={active:false,x:0,y:0};
    this.actionQueued=false;
    this.state='menu';this.time=0;this.freeze=0;
    this.shakeT=0;this.shakePow=0;
    this.score=0;this.best=store.get('best',0);
    this.combo=0;this.comboT=0;this.nerves=5;
    this.wave=0;this.spawnLeft=0;this.spawnT=0;this.spawnInterval=1.2;this.aliveCap=5;
    this.between=false;this.betweenT=0;this.stampCd=0;this.attractT=0;
    this.overShown=false;
    this.isTouch=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
    this.touchOn=this.isTouch;
    this._resize=this._resize.bind(this);
    window.addEventListener('resize',this._resize);
    this._resize();
    this._bindInput();
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&this.state==='playing')this.pause();});
    // مشهد القائمة الحيّ
    this.player.reset(this.W*.5,this.H*.55);
    for(let i=0;i<2;i++){
      const f=this.spawnFool(true);
      f.x=rand(60,this.W-60);f.y=clamp(rand(120,this.H-80),120,this.H-60);
    }
    if(document.fonts&&document.fonts.load){
      document.fonts.load('800 24px "Baloo Bhaijaan 2"');
      document.fonts.load('600 15px "Baloo Bhaijaan 2"');
    }
    this._last=performance.now();
    requestAnimationFrame(t=>this._frame(t));
  }
  // ---------- الأبعاد والأرضية ----------
  _resize(){
    this.W=window.innerWidth;this.H=window.innerHeight;
    this.dpr=Math.min(2,window.devicePixelRatio||1);
    this.cv.width=Math.round(this.W*this.dpr);
    this.cv.height=Math.round(this.H*this.dpr);
    this.cv.style.width=this.W+'px';this.cv.style.height=this.H+'px';
    this.ctx.direction='rtl';
    this.player.x=clamp(this.player.x,40,this.W-40);
    this.player.y=clamp(this.player.y,120,this.H-46);
    this._makeGround();
  }
  _makeGround(){
    const w=this.W,h=this.H;
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const c=cv.getContext('2d');
    const R=mulberry32(20240613);
    c.fillStyle='#efd489';c.fillRect(0,0,w,h);
    // بلاط الساحة
    const T=68;
    c.fillStyle='rgba(255,244,214,.16)';
    for(let gx=0;gx*T<w;gx++)for(let gy=0;gy*T<h;gy++)if((gx+gy)%2===0)c.fillRect(gx*T,gy*T,T,T);
    c.strokeStyle='rgba(122,86,44,.1)';c.lineWidth=2;
    for(let x=0;x<=w;x+=T){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke();}
    for(let y=0;y<=h;y+=T){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}
    // دائرة الساحة
    c.strokeStyle='rgba(255,255,255,.2)';c.lineWidth=10;
    c.beginPath();c.arc(w/2,h*.55,Math.min(w,h)*.28,0,TAU);c.stroke();
    c.strokeStyle='rgba(122,86,44,.12)';c.lineWidth=4;
    c.beginPath();c.arc(w/2,h*.55,Math.min(w,h)*.28-14,0,TAU);c.stroke();
    // رصيف جانبي
    c.fillStyle='#e2bd74';
    c.fillRect(0,0,w,20);c.fillRect(0,h-20,w,20);c.fillRect(0,0,20,h);c.fillRect(w-20,0,20,h);
    c.strokeStyle='rgba(58,36,24,.2)';c.lineWidth=2.5;
    c.strokeRect(20,20,w-40,h-40);
    // تفاصيل صغيرة
    const n=Math.round(w*h/26000);
    c.fillStyle='#e6c67e';
    for(let i=0;i<n;i++){
      const x=R()*w,y=R()*h;
      c.beginPath();c.ellipse(x,y,3+R()*3,2+R()*2,R()*3,0,TAU);c.fill();
    }
    c.strokeStyle='rgba(90,60,30,.18)';c.lineWidth=2;
    for(let i=0;i<6;i++){
      let x=R()*w,y=R()*h;
      c.beginPath();c.moveTo(x,y);
      for(let j=0;j<3;j++){x+=(R()-.5)*40;y+=(R()-.5)*30;c.lineTo(x,y);}
      c.stroke();
    }
    for(let i=0;i<8;i++){
      const x=R()*w,y=R()*h;
      c.strokeStyle='#7ba05b';c.lineWidth=2;
      c.beginPath();c.moveTo(x,y);c.lineTo(x,y-6);c.stroke();
      c.fillStyle=pickR(R,['#ffffff','#ffb7c5','#ffd23f']);
      for(let p=0;p<5;p++){const a=p/5*TAU;c.beginPath();c.arc(x+Math.cos(a)*3,y-8+Math.sin(a)*3,2.2,0,TAU);c.fill();}
      c.fillStyle='#e88a2d';c.beginPath();c.arc(x,y-8,1.8,0,TAU);c.fill();
    }
    for(let i=0;i<2;i++){
      const x=R()*w,y=R()*h;
      c.fillStyle='#c99e63';c.strokeStyle='rgba(58,36,24,.35)';c.lineWidth=3;
      c.beginPath();c.arc(x,y,16,0,TAU);c.fill();c.stroke();
      c.lineWidth=2;c.beginPath();c.arc(x,y,9,0,TAU);c.stroke();
      c.beginPath();c.moveTo(x-9,y);c.lineTo(x+9,y);c.moveTo(x,y-9);c.lineTo(x,y+9);c.stroke();
    }
    this.groundCv=cv;
    function pickR(r,a){return a[(r()*a.length)|0];}
  }
  // ---------- الإدخال ----------
  _bindInput(){
    window.addEventListener('keydown',e=>{
      const c=e.code;
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyJ','KeyK','Enter','KeyP','Escape'].includes(c))e.preventDefault();
      if(e.repeat)return;
      this.keys.add(c);
      if(c==='Space'||c==='KeyJ'||c==='KeyK'||c==='Enter'){
        if(this.state==='playing')this.actionQueued=true;
        else if(this.state==='menu'){this.sound.ensure();this.startGame();}
        else if(this.state==='over'&&this.overShown){this.sound.ensure();this.startGame();}
      }
      if(c==='Escape'||c==='KeyP'){
        if(this.state==='playing')this.pause();
        else if(this.state==='paused'){
          if(!this.ui.el.settings.classList.contains('hidden'))this.ui.show('pause');
          else this.resume();
        }
      }
    });
    window.addEventListener('keyup',e=>this.keys.delete(e.code));
    const kick=()=>{this.sound.ensure();if(this.sound.musicOn&&(this.state==='menu'||this.state==='playing'))this.sound.startMusic();};
    window.addEventListener('pointerdown',kick);
    this.cv.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&this.state==='playing')this.actionQueued=true;
    });
    // عصا التحكم الديناميكية
    const zone=document.getElementById('stickZone'),stick=document.getElementById('stick'),knob=document.getElementById('stickKnob');
    let joyId=null,cx=0,cy=0;
    const setKnob=(dx,dy)=>{knob.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';};
    zone.addEventListener('pointerdown',e=>{
      if(joyId!==null)return;
      joyId=e.pointerId;zone.setPointerCapture(joyId);
      cx=e.clientX;cy=e.clientY;
      stick.style.left=cx+'px';stick.style.top=cy+'px';stick.style.display='block';
      setKnob(0,0);this.joy={active:true,x:0,y:0};
    });
    zone.addEventListener('pointermove',e=>{
      if(e.pointerId!==joyId)return;
      let dx=e.clientX-cx,dy=e.clientY-cy;
      const d=Math.hypot(dx,dy),max=46;
      if(d>max){dx*=max/d;dy*=max/d;}
      setKnob(dx,dy);this.joy.x=dx/max;this.joy.y=dy/max;
    });
    const end=e=>{if(e.pointerId!==joyId)return;joyId=null;stick.style.display='none';this.joy={active:false,x:0,y:0};};
    zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
    const stomp=()=>{if(this.state==='playing')this.actionQueued=true;};
    document.getElementById('tapZone').addEventListener('pointerdown',stomp);
    document.getElementById('btnStomp').addEventListener('pointerdown',e=>{e.preventDefault();stomp();});
    window.addEventListener('touchstart',()=>{
      this.touchOn=true;
      if(this.state==='playing')this._touch(true);
    },{passive:true});
    window.addEventListener('contextmenu',e=>{if(e.target===this.cv)e.preventDefault();});
  }
  _touch(on){
    document.getElementById('touch').classList.toggle('hidden',!(on&&this.touchOn));
  }
  getInput(){
    let mx=0,my=0;
    if(this.keys.has('ArrowLeft')||this.keys.has('KeyA'))mx-=1;
    if(this.keys.has('ArrowRight')||this.keys.has('KeyD'))mx+=1;
    if(this.keys.has('ArrowUp')||this.keys.has('KeyW'))my-=1;
    if(this.keys.has('ArrowDown')||this.keys.has('KeyS'))my+=1;
    if(this.joy.active){mx=this.joy.x;my=this.joy.y;}
    const l=Math.hypot(mx,my);
    if(l>1){mx/=l;my/=l;}
    const action=this.actionQueued;this.actionQueued=false;
    return {mx,my,action};
  }
  // ---------- تدفق اللعبة ----------
  startGame(){
    this.sound.ensure();this.sound.startMusic();
    this.state='playing';this.overShown=false;
    this.ui.show(null);this.ui.hud(true);this._touch(true);
    this.fools.length=0;this.parts.length=0;
    this.score=0;this.combo=0;this.comboT=0;this.nerves=5;
    this.ui.setScore(0);this.ui.renderNerves(5,5);this.ui.comboHide();
    this.player.reset(this.W/2,this.H/2);
    this.wave=0;this.between=false;this.stampCd=0;this.freeze=0;
    this.ui.toast('دوس على الفلول لما يقربوا منك!',2.2);
    this.nextWave();
  }
  nextWave(){
    this.wave++;
    this.ui.setWave(this.wave);
    this.ui.banner('الموجة '+this.wave,'#ffc233');
    this.sound.waveSfx();
    this.spawnLeft=Math.min(30,3+this.wave*2);
    this.spawnInterval=Math.max(.32,1.25-this.wave*.06);
    this.aliveCap=Math.min(10,4+Math.floor(this.wave*.8));
    this.spawnT=.7;
  }
  spawnFool(attract){
    const m=50,side=(Math.random()*4)|0;
    let x,y;
    if(side===0){x=rand(-m,this.W+m);y=-m;}
    else if(side===1){x=this.W+m;y=rand(-m,this.H+m);}
    else if(side===2){x=rand(-m,this.W+m);y=this.H+m;}
    else{x=-m;y=rand(-m,this.H+m);}
    let v='normal';
    const r=Math.random();
    if(!attract){
      if(this.wave>=3&&r<Math.min(.22,.04+this.wave*.015))v='chunky';
      else if(r<Math.min(.34,.08+this.wave*.02))v='speedy';
    }
    const f=new Flool(x,y,v,this);
    if(attract)f.speed*=.7;
    this.fools.push(f);
    return f;
  }
  pause(){
    if(this.state!=='playing')return;
    this.state='paused';this.sound.stopMusic();
    this._touch(false);this.ui.show('pause');
  }
  resume(){
    this.state='playing';this.sound.startMusic();
    this.ui.show(null);this._touch(true);
  }
  toMenu(){
    this.state='menu';this.overShown=false;
    this.sound.startMusic();
    this.ui.show('menu');this.ui.hud(false);this._touch(false);
    this.fools.length=0;this.parts.length=0;
    this.player.reset(this.W*.5,this.H*.55);
    this.nerves=5;
    for(let i=0;i<2;i++){
      const f=this.spawnFool(true);
      f.x=rand(60,this.W-60);f.y=clamp(rand(120,this.H-80),120,this.H-60);
    }
  }
  gameOver(){
    this.state='over';this.overShown=false;
    this.sound.stopMusic();this.sound.horn();
    this._touch(false);
    this.ui.banner('انعصبت!','#e2482f');
    this.fools.forEach(f=>{
      if(f.targetable){f.state='cheer';f.cheerT=3;f.bubble={text:pick(FOOL_LINES),t:0,life:2.2};}
    });
    const isNew=this.score>this.best;
    if(isNew){this.best=this.score;store.set('best',this.best);}
    setTimeout(()=>{if(this.state==='over'){this.overShown=true;this.ui.showOver(this.score,this.best,isNew);}},1100);
  }
  // ---------- منطق الدوس ----------
  onStompImpact(p){
    this.sound.stomp();
    this.ring(p.x,p.y,p.stompR);
    for(let i=0;i<8;i++)this.dust(p.x+rand(-44,44),p.y+rand(-12,8),rand(.8,1.3));
    this.parts.push({kind:'print',x:p.x,y:p.y+2,t:0,life:.9,rot:p.facing*.15});
    this.shakeAdd(3);
    const list=this.fools.filter(f=>f.targetable&&Math.hypot(f.x-p.x,f.y-p.y)<p.stompR+f.r);
    const hits=list.length;
    if(hits>0){
      this.sound.horn();
      if(this.state==='playing'){
        this.combo++;this.comboT=2;
        if(this.combo>=2)this.ui.comboShow(this.combo);
        if(this.combo>=3&&this.stampCd<=0){this.ui.banner('داعسة!','#e2482f');this.stampCd=1.6;}
      }
      this.freeze=Math.min(.16,.05+hits*.025);
      this.shakeAdd(4+hits*2);
      list.forEach(f=>f.defeat(this));
      if(hits>=2||Math.random()<.3){p.say(pick(PLAYER_LINES));this.sound.squeal();}
    }else{
      if(this.state==='playing'){this.combo=0;this.ui.comboHide();}
      this.sound.whiff();
    }
  }
  onFloolTouch(f){
    if(this.state!=='playing'){
      if(this.state==='menu'){f.state='cheer';f.cheerT=.8;}
      return;
    }
    if(this.player.invuln>0)return;
    this.nerves--;
    this.ui.renderNerves(Math.max(0,this.nerves),5);
    this.player.invuln=1.5;
    const dx=this.player.x-f.x,dy=this.player.y-f.y,d=Math.hypot(dx,dy)||1;
    this.player.vx=dx/d*380;this.player.vy=dy/d*380;
    f.x-=dx/d*22;f.y-=dy/d*22;
    this.shakeAdd(8);this.sound.hurt();
    this.popup(this.player.x,this.player.y-96,'زعزة!','#e2482f');
    this.ui.flash();
    f.state='cheer';f.cheerT=.9;
    f.bubble={text:pick(FOOL_LINES),t:0,life:1.6};
    this.sound.giggle();
    if(this.nerves<=0)this.gameOver();
  }
  addScore(g,x,y){
    if(this.state!=='playing')return;
    this.score+=g;this.ui.setScore(this.score);
    this.popup(x,y,'+'+g,this.combo>1?'#159a8c':'#e2482f');
  }
  multNow(){return 1+.25*Math.max(0,this.combo-1);}
  get bubbleCount(){
    let n=this.player.bubble?1:0;
    for(const f of this.fools)if(f.bubble)n++;
    return n;
  }
  shakeAdd(p){if(!this.sound.shakeOn)return;this.shakePow=Math.max(this.shakePow,p);this.shakeT=.3;}
  // ---------- مؤثرات ----------
  dust(x,y,s){this.parts.push({kind:'dust',x,y,vx:rand(-14,14),vy:rand(-22,-6),t:0,life:rand(.4,.7),r:rand(5,9)*s});}
  ring(x,y,r){
    this.parts.push({kind:'ring',x,y,r,t:0,life:.35});
    this.parts.push({kind:'flashc',x,y,r:r*.8,t:0,life:.16});
  }
  smokeAt(x,y,s){
    for(let i=0;i<7;i++)this.parts.push({kind:'smoke',x:x+rand(-8,8)*s,y:y+rand(-6,6)*s,vx:rand(-30,30),vy:rand(-46,-12),t:0,life:rand(.5,.8),r:rand(9,15)*s});
  }
  burstStars(x,y){
    for(let i=0;i<5;i++)this.parts.push({kind:'star',x,y,vx:rand(-130,130),vy:rand(-190,-40),t:0,life:rand(.5,.8),rot:rand(0,TAU),vr:rand(-8,8)});
  }
  popup(x,y,text,color){this.parts.push({kind:'pop',x:x+rand(-6,6),y,t:0,life:.85,text,color});}
  confetti(){
    const colors=['#e2482f','#159a8c','#ffc233','#f6b9c9','#9fd6c8'];
    for(let i=0;i<26;i++)this.parts.push({kind:'conf',x:this.W/2+rand(-150,150),y:rand(-30,10),vx:rand(-30,30),vy:rand(60,140),t:0,life:rand(1.4,2.2),color:pick(colors),rot:rand(0,TAU),vr:rand(-6,6)});
  }
  // ---------- الذكاء التلقائي لمشهد القائمة ----------
  attract(){
    const p=this.player;
    const walkers=this.fools.filter(f=>f.state==='walk');
    const t=walkers.sort((a,b)=>(Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)))[0];
    let mx=0,my=0,action=false;
    if(t){
      const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy)||1;
      if(d>72){mx=dx/d;my=dy/d;}
      else if(p.cool<=0&&p.state!=='jump'&&p.state!=='land')action=true;
    }else{
      mx=Math.sin(this.time*.5);my=Math.cos(this.time*.37);
    }
    return {mx,my,action};
  }
  // ---------- الحلقة الرئيسية ----------
  _frame(ts){
    const dt=Math.min(.05,(ts-this._last)/1000)||.001;
    this._last=ts;
    if(this.state!=='paused')this.update(dt);
    this.draw();
    requestAnimationFrame(t=>this._frame(t));
  }
  update(dt0){
    let dt=dt0;
    if(this.freeze>0){this.freeze-=dt0;dt*=.15;}
    this.time+=dt;
    if(this.stampCd>0)this.stampCd-=dt0;
    if(this.shakeT>0){this.shakeT-=dt0;if(this.shakeT<=0)this.shakePow=0;}
    let inp;
    if(this.state==='playing'){
      inp=this.getInput();
      if(this.combo>0){this.comboT-=dt;if(this.comboT<=0){this.combo=0;this.ui.comboHide();}}
    }else if(this.state==='menu')inp=this.attract(dt);
    else inp={mx:0,my:0,action:false};
    this.player.update(dt,inp,this);
    for(const f of this.fools)f.update(dt,this);
    this.fools=this.fools.filter(f=>!f.gone);
    if(this.state==='playing'){
      if(this.spawnLeft>0){
        this.spawnT-=dt;
        const alive=this.fools.filter(f=>f.state==='walk'||f.state==='cheer').length;
        if(this.spawnT<=0&&alive<this.aliveCap){
          this.spawnFool(false);this.spawnLeft--;
          this.spawnT=this.spawnInterval*rand(.6,1.3);
        }
      }else if(!this.between&&!this.fools.some(f=>!f.gone)){
        this.between=true;this.betweenT=2.2;
        const bonus=15+this.wave*5;
        this.score+=bonus;this.ui.setScore(this.score);
        this.ui.toast('جايزة الموجة +'+bonus);
        this.sound.waveSfx();this.confetti();
      }
      if(this.between){this.betweenT-=dt;if(this.betweenT<=0){this.between=false;this.nextWave();}}
    }else if(this.state==='menu'){
      this.attractT-=dt;
      const walkers=this.fools.filter(f=>f.state==='walk').length;
      if(walkers<4&&this.attractT<=0){this.spawnFool(true);this.attractT=rand(1.6,3);}
    }
    for(const p of this.parts){
      p.t+=dt;
      if(p.kind==='dust'){p.x+=p.vx*dt;p.y+=p.vy*dt;}
      else if(p.kind==='smoke'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=dt*10;}
      else if(p.kind==='star'){p.vy+=dt*260;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
      else if(p.kind==='conf'){p.x+=p.vx*dt+Math.sin(p.t*6+p.rot)*30*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
    }
    this.parts=this.parts.filter(p=>p.t<p.life);
  }
  draw(){
    const c=this.ctx;
    c.setTransform(this.dpr,0,0,this.dpr,0,0);
    c.drawImage(this.groundCv,0,0,this.W,this.H);
    c.save();
    if(this.shakeT>0&&this.shakePow>0){
      const m=this.shakePow*(this.shakeT/.3);
      c.translate(rand(-m,m),rand(-m,m));
    }
    // بصمة الحذاء تحت الشخصيات
    for(const p of this.parts){
      if(p.kind!=='print')continue;
      const k=p.t/p.life;
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=(1-k)*.3;
      c.fillStyle='#8a5a34';
      rr(c,-12,-24,22,18,6);c.fill();
      rr(c,-13,-8,24,9,4);c.fill();
      c.restore();
    }
    c.globalAlpha=1;
    const ents=[this.player,...this.fools].sort((a,b)=>a.y-b.y);
    for(const e of ents)e.drawShadow(c);
    for(const e of ents)e.draw(c,this.time);
    // باقي المؤثرات
    for(const p of this.parts){
      const k=p.t/p.life;
      switch(p.kind){
        case 'dust':
          c.globalAlpha=(1-k)*.5;c.fillStyle='#d9b46b';
          c.beginPath();c.arc(p.x,p.y,p.r*(1+k*1.6),0,TAU);c.fill();break;
        case 'smoke':
          c.globalAlpha=(1-k)*.9;c.fillStyle='#efe9df';
          c.beginPath();c.arc(p.x,p.y,p.r*(1+k*1.8),0,TAU);c.fill();break;
        case 'ring':{
          c.globalAlpha=1-k;c.strokeStyle='#fff6dd';c.lineWidth=2+9*(1-k);
          c.beginPath();c.arc(p.x,p.y,p.r*eoc(k),0,TAU);c.stroke();break;
        }
        case 'flashc':
          c.globalAlpha=(1-k)*.35;c.fillStyle='#fff';
          c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill();break;
        case 'star':
          c.globalAlpha=1-k*k;c.fillStyle='#ffc233';c.strokeStyle=INK;c.lineWidth=2;
          starPath(c,p.x,p.y,7*(1-k*.4),p.rot);c.fill();c.stroke();break;
        case 'conf':
          c.globalAlpha=1-Math.max(0,k-.6)/.4;
          c.save();c.translate(p.x,p.y);c.rotate(p.rot);
          c.fillStyle=p.color;c.fillRect(-4,-3,8,6);c.restore();break;
        case 'pop':{
          c.globalAlpha=1-k;
          const y=p.y-46*eoc(k);
          c.font='800 22px '+FONT;c.textAlign='center';c.textBaseline='middle';
          c.direction=p.text[0]==='+'?'ltr':'rtl';
          c.lineJoin='round';c.lineWidth=5;c.strokeStyle=INK;
          c.strokeText(p.text,p.x,y);
          c.fillStyle=p.color;c.fillText(p.text,p.x,y);break;
        }
      }
    }
    c.globalAlpha=1;
    // فقاعات الكلام
    for(const e of ents){
      if(!e.bubble)continue;
      const b=e.bubble;
      const popk=eob(Math.min(1,b.t/.14));
      const fade=b.t>b.life-.25?(b.life-b.t)/.25:1;
      const topY=e===this.player?e.y-124:e.y-98*e.scale;
      c.save();
      c.globalAlpha=Math.max(0,fade);
      c.font='600 15px '+FONT;
      c.textAlign='center';c.textBaseline='middle';c.direction='rtl';
      const tw=c.measureText(b.text).width;
      const w=Math.min(this.W-24,tw+26),h=28;
      let bx=clamp(e.x,w/2+8,this.W-w/2-8);
      c.translate(bx,topY);
      c.scale(popk,popk);
      // ذيل الفقاعة
      c.fillStyle='#fffdf3';c.strokeStyle=INK;c.lineWidth=2.5;c.lineJoin='round';
      c.beginPath();c.moveTo(-7,-3);c.lineTo(0,10);c.lineTo(7,-3);c.closePath();c.fill();c.stroke();
      rr(c,-w/2,-h,w,h,13);c.fill();c.stroke();
      c.fillStyle=INK;c.fillText(b.text,0,-h/2);
      c.restore();
    }
    c.restore();
  }
}

(function boot(){
  const game=new Game(document.getElementById('game'));
  const hint=document.getElementById('hintText');
  hint.textContent=game.isTouch
    ?'حرّك بعصا التحكم على يسار الشاشة، ودوس بزر «داعس»!'
    :'التحريك بأسهم الكيبورد، والدوس بزر المسافة';
  window.addEventListener('touchstart',()=>{
    hint.textContent='حرّك بعصا التحكم على يسار الشاشة، ودوس بزر «داعس»!';
  },{once:true,passive:true});
})();
</script>
